name: Release

# Publishes packages/mcp-server to npm when a tag like v0.1.0 is pushed.
# Authentication uses npm Trusted Publishing (OIDC): the package on npmjs.com
# trusts this repository's release.yml, so no NPM_TOKEN secret is needed. The
# tag must match the version in packages/mcp-server/package.json.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check tag matches package version
        run: |
          pkg=$(node -p "require('./packages/mcp-server/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then echo "package.json version $pkg != tag $tag"; exit 1; fi
      - name: Publish to npm (OIDC trusted publisher, with provenance)
        working-directory: packages/mcp-server
        run: npm publish --provenance --access public
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
